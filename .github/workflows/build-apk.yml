name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Klasorleri hazirla
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png assets/icon.png
      - run: npm install
      - run: npm install @capacitor-community/speech-recognition@^7.0.0
      - run: npm install @capgo/capacitor-native-biometric@^7.0.0
      - run: npx cap add android
      - name: Yumusak alarm sesi ve izinler
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import math,struct,wave
          sr=22050
          notes=[(523.25,0.0),(659.25,0.5),(783.99,1.0),(1046.5,1.5),(783.99,2.6),(659.25,3.1),(523.25,3.6)]
          total=int(sr*6.5)
          buf=[0.0]*total
          for f,t0 in notes:
              s=int(t0*sr)
              for i in range(int(sr*1.6)):
                  if s+i>=total:
                      break
                  t=i/sr
                  env=min(1,t/0.01)*math.exp(-3.0*t)
                  v=math.sin(2*math.pi*f*t)+0.3*math.sin(2*math.pi*f*2.01*t)+0.1*math.sin(2*math.pi*f*3.0*t)
                  buf[s+i]+=v*env
          m=max(abs(x) for x in buf)
          w=wave.open('android/app/src/main/res/raw/melodi.wav','wb')
          w.setnchannels(1)
          w.setsampwidth(2)
          w.setframerate(sr)
          w.writeframes(b''.join(struct.pack('<h',int(x/m*20000)) for x in buf))
          w.close()
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          perms=''.join('    <uses-permission android:name="android.permission.%s" />\n'%x for x in ['POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','VIBRATE','WAKE_LOCK','RECEIVE_BOOT_COMPLETED','RECORD_AUDIO','USE_BIOMETRIC','USE_FINGERPRINT'])
          q='    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n'
          s=s.replace('</manifest>',perms+q+'</manifest>')
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Simgeler
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffe3f1' --iconBackgroundColorDark '#2a1f42'
      - run: npx cap sync android
      - name: Sabit imza anahtari
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: derinsu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
