let ac,beepT,alNote;
document.addEventListener('click',()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}});
function bell(f,t0,dur=1.5,vol=.16){if(!ac)return;try{[[1,1],[2.01,.3]].forEach(([m,v])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol*v,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+.1)})}catch(e){}}
function melody(){if(!ac)return;const t=ac.currentTime+.05;[523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,t+i*.3))}
function chime(){if(!ac)return;const t=ac.currentTime+.02;bell(783.99,t,1.2,.12);bell(1046.5,t+.18,1.4,.1)}
function ring(n){alNote=n;$('#al-t').textContent=n.time+' · '+n.text;$('#alarm').classList.add('show');melody();clearInterval(beepT);beepT=setInterval(()=>{melody();navigator.vibrate&&navigator.vibrate([250,120,250])},3500)}
function stopRing(){clearInterval(beepT);$('#alarm').classList.remove('show');navigator.vibrate&&navigator.vibrate(0)}
function notify(n){chime();toast('🔔 '+n.time+' · '+n.text);try{if(!NAT&&'Notification' in window&&Notification.permission==='granted')new Notification('derinsu · '+n.time,{body:n.text})}catch(e){}}
function tick(){const d=iso(new Date()),t=nowT();let ch=false;
 for(const n of S.notes){if(n.done||n.fired||n.date!==d||!n.time||n.time>t)continue;
  n.fired=true;ch=true;
  const late=(new Date('2000-01-01T'+t)-new Date('2000-01-01T'+n.time))/6e4;
  if(late>30)continue;
  if(NP){if(n.imp)ring(n)}else n.imp?ring(n):notify(n)}
 if(ch){save();if(view==='plan'||view==='cal')render()}}

const NW={bir:1,iki:2,üç:3,dört:4,beş:5,altı:6,yedi:7,sekiz:8,dokuz:9,on:10,onbir:11,oniki:12};
const WD={pazartesi:1,salı:2,çarşamba:3,perşembe:4,cuma:5,cumartesi:6,pazar:0};
function parseVoice(txt,now=new Date()){
 const t=txt.toLowerCase('tr').replace(/’/g,"'").trim();let date=null,hm=null,m;
 const today=iso(now);
 if(/öbür gün|ertesi gün/.test(t))date=addDays(today,2);else if(/yarın/.test(t))date=addDays(today,1);else if(/bugün/.test(t))date=today;else if(/haftaya/.test(t))date=addDays(today,7);
 else{for(const w in WD)if(new RegExp('\\b'+w).test(t)){let diff=(WD[w]-now.getDay()+7)%7;if(diff===0)diff=7;date=addDays(today,diff);break}}
 m=t.match(/(\d{1,2})\s*[:.]\s*(\d{2})/);if(m&&+m[1]<24&&+m[2]<60)hm=[+m[1],+m[2]];
 if(!hm){m=t.match(/saat\s*(\d{1,2})(?:\s*(buçuk))?/);if(m&&+m[1]<=24)hm=[+m[1],m[2]?30:0]}
 if(!hm){m=t.match(/\b(\d{1,2})\s*'?\s*(?:de|da|te|ta)\b/);if(m&&+m[1]<=24)hm=[+m[1],0]}
 if(!hm){const w=t.split(/\s+/);for(let i=0;i<w.length;i++){let x=w[i].replace(/'/g,'');if(x==='saat'&&w[i+1]&&NW[w[i+1].replace(/(de|da|te|ta)$/,'')]){hm=[NW[w[i+1].replace(/(de|da|te|ta)$/,'')],w[i+2]==='buçuk'?30:0];break}
  const y=x.replace(/(de|da|te|ta)$/,'');if(y!==x&&NW[y]){hm=[NW[y],w[i+1]==='buçuk'?30:0];break}}}
 if(hm){if(hm[0]<12&&/akşam|öğleden sonra|gece/.test(t))hm[0]+=12;if(hm[0]===12&&/sabah/.test(t))hm[0]=0;if(hm[0]===24)hm[0]=0}
 if(!date){const h=now.getHours();date=(h>=21)?addDays(today,1):today;
  if(hm&&date===today&&(hm[0]*60+hm[1])<=(h*60+now.getMinutes()))date=addDays(today,1)}
 const time=hm?String(hm[0]).padStart(2,'0')+':'+String(hm[1]).padStart(2,'0'):'';
 let text=txt.trim();text=text.charAt(0).toLocaleUpperCase('tr')+text.slice(1);
 return{text,date,time,imp:/önemli|acil/.test(t)}}
async function listenOnce(){

  const p=await SRN.requestPermissions();if(p.speechRecognition!=='granted'){toast('Mikrofon izni gerekli');return ''}
  const r=await SRN.start({language:'tr-TR',maxResults:1,partialResults:false,popup:false});return(r&&r.matches&&r.matches[0])||''}catch(e){return ''}}
 const W=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(W)return new Promise(res=>{const r=new W();curRec=r;r.lang='tr-TR';r.interimResults=false;let d=false;r.onresult=e=>{d=true;res(e.results[0][0].transcript)};r.onerror=()=>{if(!d){d=true;res('')}};r.onend=()=>{if(!d)res('')};try{r.start()}catch(e){res('')}});

const capSF=()=>{const a=$('#s-title'),b=$('#s-text');if(a)sf.title=a.value;if(b)sf.text=b.value};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,D=b.dataset;
 const n=S.notes.find(x=>x.id===D.id);
 if(a==='tab'){if(view==='night'&&D.v!=='night')stopListen();if(view==='secret'){capSF();recover=false}view=D.v;render();if(D.v==='secret')bioCheck()}
 else if(a==='add'){const t=$('#n-text').value.trim();if(!t)return toast('Önce bir şey yaz');
  const date=$('#n-date').value||selDate,time=$('#n-time').value;selDate=date;
  S.notes.push({id:id(),text:t,date,time,imp:$('#n-imp').checked,done:false,fired:false});save();
  if(!time)toast('Saat girmedin: hatırlatma gelmeyecek');render()}
 else if(a==='done'){n.done=!n.done;save();render()}
 else if(a==='imp'){n.imp=!n.imp;save();render();toast(n.imp?'Önemli: yumuşak alarm çalacak':'Normal bildirim')}
 else if(a==='del'){S.notes=S.notes.filter(x=>x.id!==D.id);save();render()}
 else if(a==='newq'){qOff=Math.floor(Math.random()*500)+1;render()}
 else if(a==='day'){selDate=D.d==='0'?iso(new Date()):addDays(selDate,+D.d);render()}
 else if(a==='wk'){wk=D.d==='0'?0:wk+ +D.d;render()}
 else if(a==='mo'){mo+= +D.d;render()}
 else if(a==='cmode'){calMode=D.v;render()}
 else if(a==='pick'){selDate=D.d;render()}
 else if(a==='goday'){selDate=D.d;view='plan';render()}
 else if(a==='perm'){try{Notification.requestPermission().then(render)}catch(e){}}
 else if(a==='mic'){if(listening){stopListen();setStatus('Durdu')}else nightLoop()}
 else if(a==='s-auto'){S.set.auto=b.checked;save()}
 else if(a==='s-speak'){S.set.speak=b.checked;save()}
 else if(a==='setpin'){const v=$('#pin').value,v2=$('#pin2').value;if(v.length<4)return toast('En az 4 karakter');if(v!==v2)return toast('İki PIN aynı değil');
  bioVerify('PIN’ini unutursan seni kurtaracak parmak izini doğrula').then(ok=>{if(!ok)return toast('Parmak izi doğrulanamadı, PIN kaydedilmedi');S.pin=hash(v);S.bio=true;save();unlocked=true;render();toast('Gizli köşe hazır')})}
 else if(a==='biorecheck'){bioOK=null;render();bioCheck()}
 else if(a==='bioenroll'){bioVerify('Kurtarma için parmak izini doğrula').then(ok=>{if(!ok)return toast('Doğrulanamadı, tekrar dene');S.bio=true;save();render();toast('Parmak izi kurtarma etkin')})}
 else if(a==='biorecover'){bioVerify('PIN’ini sıfırlamak için parmak izini doğrula').then(ok=>{if(!ok)return toast('Parmak izi doğrulanamadı');recover=true;render()})}
 else if(a==='recoversave'){const v=$('#pin').value,v2=$('#pin2').value;if(v.length<4)return toast('En az 4 karakter');if(v!==v2)return toast('İki PIN aynı değil');S.pin=hash(v);save();recover=false;unlocked=true;render();toast('Yeni PIN kaydedildi')}
 else if(a==='resetpin'){if(confirm('Bu telefonda kurtarma yolu yok. PIN sıfırlanırsa TÜM gizli notlar silinir. Emin misin?')){S.pin=0;S.secrets=[];S.bio=false;save();render()}}
 else if(a==='unlock'){if(hash($('#pin').value)===S.pin){unlocked=true;render()}else toast('Yanlış PIN')}
 else if(a==='lock'){unlocked=false;shown={};render()}
 else if(a==='pinform'){capSF();pinForm=!pinForm;render()}
 else if(a==='pinsave'){if(hash($('#pin-old').value)!==S.pin)return toast('Eski PIN yanlış');const v=$('#pin-new').value;if(v.length<4)return toast('Yeni PIN en az 4 karakter');S.pin=hash(v);save();pinForm=false;render();toast('PIN değişti')}
 else if(a==='smood'){capSF();sf.mood=D.v;render()}
 else if(a==='stag'){capSF();sf.tag=D.v;render()}
 else if(a==='sadd'){capSF();if(!sf.text.trim())return toast('Bir şeyler yaz');
  if(editId){const s=S.secrets.find(x=>x.id===editId);Object.assign(s,{title:sf.title.trim(),text:sf.text.trim(),mood:sf.mood,tag:sf.tag});editId=null}
  else S.secrets.unshift({id:id(),title:sf.title.trim(),text:sf.text.trim(),mood:sf.mood,tag:sf.tag,ts:Date.now()});
  sf={title:'',text:'',mood:'😊',tag:'Günlük'};save();render()}
 else if(a==='scancel'){editId=null;sf={title:'',text:'',mood:'😊',tag:'Günlük'};render()}
 else if(a==='sedit'){const s=S.secrets.find(x=>x.id===D.id);editId=s.id;sf={title:s.title||'',text:s.text,mood:s.mood||'😊',tag:s.tag||'Günlük'};render();window.scrollTo(0,0)}
 else if(a==='reveal'){shown[D.id]=!shown[D.id];capSF();render()}
 else if(a==='sdel'){if(confirm('Bu gizli not silinsin mi?')){S.secrets=S.secrets.filter(x=>x.id!==D.id);save();render()}}
 else if(a==='theme'){S.set.theme=D.v;S.set.chosen=true;save();render()}
 else if(a==='themeok'){S.set.chosen=true;save();render()}
 else if(a==='photo'){$('#ph').click()}
 else if(a==='pedit'){editProf=!editProf;render()}
 else if(a==='pint'){const l=S.profile.int||[],i=l.indexOf(D.v);i>=0?l.splice(i,1):l.push(D.v);S.profile.int=l;save();render()}
 else if(a==='wfcat'){capWF();wf.cat=D.v;render()}
 else if(a==='wfsize'){capWF();wf.size=D.v;render()}
 else if(a==='wfilter'){capWF();wCat=D.v;render()}
 else if(a==='wadd'){capWF();if(!wf.title.trim())return toast('Başarına kısa bir başlık yaz');
  if(wEdit){const w=S.wins.find(x=>x.id===wEdit);Object.assign(w,{title:wf.title.trim(),text:wf.text.trim(),cat:wf.cat,size:wf.size});wEdit=null}
  else S.wins.unshift({id:id(),title:wf.title.trim(),text:wf.text.trim(),cat:wf.cat,size:wf.size,date:iso(new Date()),ts:Date.now(),fav:false});
  wf={title:'',text:'',cat:'Kişisel',size:'Küçük'};save();render();toast('Başarı kaydedildi')}
 else if(a==='wcancel'){wEdit=null;wf={title:'',text:'',cat:'Kişisel',size:'Küçük'};render()}
 else if(a==='wedit'){const w=S.wins.find(x=>x.id===D.id);wEdit=w.id;wf={title:w.title,text:w.text||'',cat:w.cat,size:w.size};render();window.scrollTo(0,0)}
 else if(a==='wfav'){const w=S.wins.find(x=>x.id===D.id);w.fav=!w.fav;save();render()}
 else if(a==='wdel'){if(confirm('Bu başarı silinsin mi?')){S.wins=S.wins.filter(x=>x.id!==D.id);save();render()}}
 else if(a==='wcard'){const w=S.wins.find(x=>x.id===D.id);makeCard('win',w).then(c=>shareCanvas(c,'basari'))}
 else if(a==='pcard'){makeCard('me').then(c=>shareCanvas(c,'profil'))}
 else if(a==='mclose'){$('#modal').classList.remove('show')}
 else if(a==='bkcopy'){const t=JSON.stringify(S);navigator.clipboard.writeText(t).then(()=>toast('Yedek kopyalandı')).catch(()=>toast('Kopyalanamadı'))}
 else if(a==='bkload'){try{const o=JSON.parse($('#bk-in').value);if(!o||!Array.isArray(o.notes)||!Array.isArray(o.wins))throw 0;if(!confirm('Mevcut veriler yedektekiyle değiştirilecek. Devam edilsin mi?'))return;S=Object.assign(S,o);save();toast('Yedek yüklendi');setTimeout(()=>location.reload(),600)}catch(e){toast('Yedek metni geçersiz')}}
 else if(a==='resetall'){if(confirm('TÜM verilerin silinecek. Emin misin?')){try{localStorage.removeItem('defterim')}catch(e){}location.reload()}}
 else if(a==='al-done'){if(alNote){alNote.done=true;save()}stopRing();render()}
 else if(a==='al-snooze'){if(alNote){const d=new Date(Date.now()+3e5);alNote.time=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');alNote.fired=false;save()}stopRing();render();toast('5 dakika sonra tekrar')}
 else if(a==='al-off'){stopRing()}
});
if(S.set.auto)view='night';
render();tick();
nativeInit().then(nativeSync);bioCheck();
if(S.set.auto)setTimeout(nightLoop,900);
</script>
</body>
</html>
